services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mediavault-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - mediavault-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediavault:
    image: omprasannasahoo181/mediavault:latest
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      APP_ROLE: all
      PORT: "3000"
      API_PORT: "5000"
      INTERNAL_API_URL: http://127.0.0.1:5000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mediavault}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:?Set a 32+ character JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DOWNLOADS_DIR: /data/downloads
      COOKIES_DIR: /data/cookies
      DOWNLOAD_TTL_MINUTES: ${DOWNLOAD_TTL_MINUTES:-30}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-0}
      MAX_BATCH_ITEMS: ${MAX_BATCH_ITEMS:-0}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-2147483648}
    volumes:
      - ${HOST_DOWNLOADS_DIR:-./data/downloads}:/data/downloads
      - ${HOST_COOKIES_DIR:-./data/cookies}:/data/cookies
    networks:
      - mediavault-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles:
      - tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    env_file:
      - path: .env
        required: false
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      - mediavault-net
    depends_on:
      mediavault:
        condition: service_healthy

networks:
  mediavault-net:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
