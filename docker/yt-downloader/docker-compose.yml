# Standalone MediaVault stack — no repository clone required.
# Download only this file, then run:   docker compose up -d
# Docker Desktop shows all containers grouped under the "yt-downloader" project.
#
# Optional overrides (shell env vars or a .env file next to this file):
#   JWT_SECRET            32+ chars; leave unset to auto-generate & persist one
#   ALLOW_REGISTRATION    true/false (default true)
#   CLIENT_PORT           host port (default 3000)
#   HOST_DOWNLOADS_DIR    host folder for finished downloads
#   Other MediaVault runtime settings listed in .env.example
name: yt-downloader

services:
  mongo:
    image: mongo:7
    container_name: mediavault-mongo
    restart: unless-stopped
    labels:
      com.docker.compose.project: yt-downloader
      com.docker.compose.project-name: yt-downloader
    volumes:
      - mongo_data:/data/db
    networks:
      - mediavault-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: mediavault-redis
    restart: unless-stopped
    labels:
      com.docker.compose.project: yt-downloader
      com.docker.compose.project-name: yt-downloader
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - mediavault-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mediavault:
    image: omprasannasahoo181/mediavault:latest
    container_name: mediavault
    restart: unless-stopped
    labels:
      com.docker.compose.project: yt-downloader
      com.docker.compose.project-name: yt-downloader
    ports:
      - "${CLIENT_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      APP_ROLE: all
      PORT: "3000"
      API_PORT: "5000"
      INTERNAL_API_URL: http://127.0.0.1:5000
      REMOTE_TUNNEL_ORIGIN: http://127.0.0.1:3000
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MONGO_URI: ${MONGO_URI:-mongodb://mediavault-mongo:27017/mediavault}
      REDIS_URL: ${REDIS_URL:-redis://mediavault-redis:6379}
      DOWNLOADS_DIR: /data/downloads
      COOKIES_DIR: /data/cookies
      DOWNLOAD_TTL_MINUTES: ${DOWNLOAD_TTL_MINUTES:-30}
      CLEANUP_INTERVAL_MINUTES: ${CLEANUP_INTERVAL_MINUTES:-5}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_PLAYLIST_ITEMS: ${MAX_PLAYLIST_ITEMS:-0}
      MAX_BATCH_ITEMS: ${MAX_BATCH_ITEMS:-0}
      MIN_FREE_DISK_BYTES: ${MIN_FREE_DISK_BYTES:-2147483648}
    volumes:
      - ${HOST_DOWNLOADS_DIR:-~/Downloads/MediaVault}:/data/downloads
      - cookies:/data/cookies
      - config:/data/config
    networks:
      - mediavault-net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  mediavault-net:
    name: mediavault-net

# Fixed names so data is shared with containers created via plain `docker run`
volumes:
  mongo_data:
    name: mediavault_mongo
  redis_data:
    name: mediavault_redis
  cookies:
    name: mediavault_cookies
  config:
    name: mediavault_config
